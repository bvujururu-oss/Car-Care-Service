<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPM Performance & Automotive Repair - Chegutu</title>
    <style>
        :root {
            --dark-bg: #0b0c10;
            --card-bg: #1f2833;
            --racing-red: #dc2626;
            --neon-green: #22c55e;
            --pure-white: #ffffff;
            --text-muted: #9ca3af;
            --whatsapp-green: #25D366;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--pure-white);
            line-height: 1.6;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        header {
            background-color: #000000;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--racing-red);
        }
        .logo h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--pure-white);
            font-style: italic;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        .logo span {
            color: var(--neon-green);
        }
        nav a {
            color: var(--pure-white);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav a:hover {
            color: var(--racing-red);
        }
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), url('https://unsplash.com') no-repeat center center/cover;
            padding: 8rem 2rem;
            text-align: center;
            border-bottom: 4px solid var(--neon-green);
        }
        .hero h2 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--pure-white);
            margin-bottom: 1rem;
        }
        .hero h2 span {
            color: var(--racing-red);
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: var(--text-muted);
        }
        .btn {
            background-color: var(--neon-green);
            color: #000;
            padding: 0.85rem 2rem;
            text-decoration: none;
            font-weight: 900;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        .btn:hover {
            background-color: var(--racing-red);
            color: var(--pure-white);
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 4rem 2rem;
        }
        .section-title {
            text-align: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3rem;
            color: var(--pure-white);
        }
        .section-title span {
            color: var(--racing-red);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-bottom: 4px solid var(--racing-red);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-bottom-color: var(--neon-green);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #222;
        }
        .card-content {
            padding: 1.5rem;
        }
        .card h3 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: var(--neon-green);
            text-transform: uppercase;
        }
        .card p {
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        .pricing-section {
            background-color: #111827;
            padding: 4rem 2rem;
            border-top: 4px solid var(--neon-green);
            border-bottom: 4px solid var(--racing-red);
        }
        .table-container {
            max-width: 900px;
            margin: auto;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
        }
        th {
            background-color: #000000;
            color: var(--neon-green);
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
        </tr>
        tr {
            border-bottom: 1px solid #374151;
        }
        td.price {
            color: var(--racing-red);
            font-weight: bold;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.2rem;
        }
        .info-section {
            background-color: #000000;
            padding: 4rem 2rem;
        }
        .info-grid {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
        }
        .info-box h3 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--racing-red);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }
        .info-box p, .info-box li {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            color: #e5e7eb;
        }
        .info-box span {
            color: var(--neon-green);
            font-weight: bold;
        }
        .info-box ul {
            list-style: none;
        }
        .contact-link {
            color: var(--pure-white);
            text-decoration: none;
        }
        .contact-link:hover {
            color: var(--neon-green);
        }
        .booking-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 6px;
            border: 1px solid #374151;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            padding: 0.75rem;
            background: #0b0c10;
            border: 1px solid #4b5563;
            color: white;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--neon-green);
        }
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 40px;
            right: 40px;
            background-color: var(--whatsapp-green);
            color: #FFF;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            z-index: 100;
            transition: transform 0.3s;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }
        .whatsapp-icon {
            width: 32px;
            height: 32px;
            fill: white;
        }
        footer {
            background-color: #050505;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
            border-top: 1px solid #1f2937;
        }
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            nav a { margin: 0 0.5rem; }
            .hero h2 { font-size: 2.3rem; }
            .whatsapp-float { bottom: 20px; right: 20px; width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <a href="https://wa.me." class="whatsapp-float" target="_blank" title="Chat on WhatsApp">
        <svg class="whatsapp-icon" viewBox="0 0 24 24">
